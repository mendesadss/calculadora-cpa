<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Calculadora de CPA · Global Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#0E0E0E;
    --muted:#6B6D66;
    --line:#E4E5E0;
    --field:#F5F6F1;
    --green:#96BF48;
    --green-ink:#3E7A22;
    --red:#C0392B;
    --c-custo:#0E0E0E;
    --c-taxa:#9A9C95;
    --c-lucro:#3E7A22;
    --c-ads:#96BF48;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Schibsted Grotesk',-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* Topo */
  .top{border-bottom:1px solid var(--line)}
  .top-in{
    max-width:1180px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand strong{font-size:18px;font-weight:800;letter-spacing:-.01em}
  .pill{
    font-size:13px;font-weight:600;color:var(--green-ink);
    background:color-mix(in srgb,var(--green) 18%,#fff);
    border-radius:999px;padding:3px 10px;
  }
  .ig{
    font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;
    display:flex;align-items:center;gap:6px;
  }
  .ig:hover{color:var(--green-ink)}
  .ig svg{width:18px;height:18px}

  main{max-width:1180px;margin:0 auto;padding:44px 24px 64px}
  h1{
    font-size:clamp(30px,4.4vw,48px);font-weight:800;
    letter-spacing:-.035em;line-height:1.05;margin-bottom:36px;
  }

  .grid{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:56px;align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:1fr;gap:32px}}

  /* Entradas */
  .inputs{display:grid;gap:18px}
  .moedas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .moedas button{
    flex:1;font:inherit;font-size:15px;font-weight:600;
    background:var(--field);color:var(--muted);
    border:0;border-radius:8px;min-height:44px;cursor:pointer;
  }
  .moedas button[aria-pressed="true"]{background:var(--ink);color:#fff}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  label small{font-weight:400;color:var(--muted)}
  .box{
    display:flex;align-items:center;background:var(--field);
    border:1px solid var(--field);border-radius:10px;
    transition:border-color .15s;
  }
  .box:focus-within{border-color:var(--ink);background:#fff}
  .box span{padding-left:16px;color:var(--muted);font-weight:600;font-size:18px}
  .box span.suf{padding:0 16px 0 0}
  .box input{
    flex:1;min-width:0;border:0;background:transparent;outline:none;
    font:inherit;font-size:22px;font-weight:600;color:var(--ink);
    padding:14px;
  }
  .box input::placeholder{color:#B9BBB3;font-weight:500}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  input[type=number]{-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* Resultado */
  .empty{
    border:1.5px dashed #D9DBD3;border-radius:16px;
    padding:64px 24px;text-align:center;color:var(--muted);
  }
  .res[hidden],.empty[hidden]{display:none}

  .kpis{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
  @media (max-width:520px){.kpis{grid-template-columns:1fr}}
  .kpi{border-radius:16px;padding:22px 24px}
  .kpi.ideal{background:var(--ink);color:#fff}
  .kpi.max{border:1.5px solid var(--line)}
  .kpi h2{font-size:15px;font-weight:600}
  .kpi.ideal h2{color:var(--green)}
  .kpi p{font-size:14px;color:var(--muted);margin-top:2px}
  .kpi.ideal p{color:#A9ABA4}
  .kpi .v{font-size:clamp(40px,4.6vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1.1;margin-top:12px}

  /* Barra: para onde vai o preço de venda */
  .split{margin-top:32px}
  .split-h{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600;margin-bottom:10px}
  .split-h .num{color:var(--muted);font-weight:500}
  .bar{display:flex;height:48px;border-radius:10px;overflow:hidden;background:var(--field)}
  .bar i{display:block;height:100%;transition:flex-basis .35s ease}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
  .legend{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  @media (max-width:620px){.legend{grid-template-columns:1fr 1fr}}
  .legend li{font-size:14px;color:var(--muted);border-left:4px solid;padding-left:10px}
  .legend b{display:block;color:var(--ink);font-size:18px;font-weight:700}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  @media (max-width:520px){.stats{grid-template-columns:1fr}}
  .stats div{padding:16px 0}
  .stats div + div{border-left:1px solid var(--line);padding-left:18px}
  @media (max-width:520px){.stats div + div{border-left:0;padding-left:0;border-top:1px solid var(--line)}}
  .stats dt{font-size:14px;color:var(--muted)}
  .stats dd{font-size:26px;font-weight:700;letter-spacing:-.02em}

  .verdict{margin-top:20px;border-radius:14px;padding:18px 20px;font-size:15px}
  .verdict strong{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:4px}
  .verdict strong::before{content:"";width:10px;height:10px;border-radius:50%;flex:none;background:currentColor}
  .verdict span{display:block;padding-left:20px}
  .verdict.ok{background:#EEF5E2}
  .verdict.ok strong::before{background:var(--green-ink)}
  .verdict.meh{background:var(--field)}
  .verdict.bad{background:#FBECEA}
  .verdict.bad strong{color:var(--red)}

  .err{color:var(--red);font-size:14px;font-weight:600}

  abbr{text-decoration:none;border-bottom:1px dotted currentColor;cursor:help}

  footer{border-top:1px solid var(--line);padding:20px 24px;text-align:center;font-size:14px;color:var(--muted)}
  :focus-visible{outline:2px solid var(--green-ink);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><strong>Global Brand</strong><span class="pill">Drop Global</span></div>
    <a class="ig" href="https://instagram.com/mendes.adss" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      @mendes.adss
    </a>
  </div>
</header>

<main>
  <h1>Calculadora de CPA</h1>

  <div class="grid">
    <section class="inputs" aria-label="Dados do produto">
      <div>
        <label id="lblMoeda">Moeda</label>
        <div class="moedas" role="group" aria-labelledby="lblMoeda">
          <button type="button" data-cur="$" aria-pressed="true">$</button>
          <button type="button" data-cur="€" aria-pressed="false">€</button>
          <button type="button" data-cur="£" aria-pressed="false">£</button>
          <button type="button" data-cur="R$" aria-pressed="false">R$</button>
        </div>
      </div>

      <div>
        <label for="custo">Custo do produto <small>com frete</small></label>
        <div class="box"><span class="cur">$</span><input type="number" id="custo" inputmode="decimal" min="0" step="0.01" placeholder="10,00"></div>
      </div>

      <div>
        <label for="ticket">Preço de venda</label>
        <div class="box"><span class="cur">$</span><input type="number" id="ticket" inputmode="decimal" min="0" step="0.01" placeholder="49,00"></div>
      </div>

      <div class="pair">
        <div>
          <label for="taxa">Taxa</label>
          <div class="box"><input type="number" id="taxa" inputmode="decimal" min="0" max="50" step="0.1" value="5"><span class="suf">%</span></div>
        </div>
        <div>
          <label for="lucro">Lucro desejado</label>
          <div class="box"><input type="number" id="lucro" inputmode="decimal" min="0" max="90" step="1" value="20"><span class="suf">%</span></div>
        </div>
      </div>

      <p class="err" id="err" role="alert" hidden></p>
    </section>

    <section aria-label="Resultado" aria-live="polite">
      <div class="empty" id="empty">Preencha o custo e o preço de venda.</div>

      <div class="res" id="res" hidden>
        <div class="kpis">
          <div class="kpi ideal">
            <h2><abbr title="Custo por aquisição: quanto você paga de anúncio por venda">CPA</abbr> ideal</h2>
            <p id="pIdeal">garante seu lucro</p>
            <div class="v num" id="cpaIdeal">–</div>
          </div>
          <div class="kpi max">
            <h2><abbr title="Custo por aquisição: quanto você paga de anúncio por venda">CPA</abbr> máximo</h2>
            <p>acima disso, prejuízo</p>
            <div class="v num" id="cpaMax">–</div>
          </div>
        </div>

        <div class="split">
          <div class="split-h"><span>Para onde vai cada venda</span><span class="num" id="sTicket"></span></div>
          <div class="bar" aria-hidden="true">
            <i id="bCusto" style="background:var(--c-custo)"></i>
            <i id="bTaxa" style="background:var(--c-taxa)"></i>
            <i id="bLucro" style="background:var(--c-lucro)"></i>
            <i id="bAds" style="background:var(--c-ads)"></i>
          </div>
          <ul class="legend">
            <li style="border-color:var(--c-custo)">Custo<b class="num" id="lCusto"></b></li>
            <li style="border-color:var(--c-taxa)">Taxa<b class="num" id="lTaxa"></b></li>
            <li style="border-color:var(--c-lucro)">Seu lucro<b class="num" id="lLucro"></b></li>
            <li style="border-color:var(--c-ads)">Anúncio<b class="num" id="lAds"></b></li>
          </ul>
        </div>

        <dl class="stats">
          <div><dt>Markup</dt><dd class="num" id="rMarkup">–</dd></div>
          <div><dt><abbr title="Retorno sobre o gasto em anúncio: faturamento ÷ investimento">ROAS</abbr> mínimo</dt><dd class="num" id="rRoasMin">–</dd></div>
          <div><dt><abbr title="Retorno sobre o gasto em anúncio: faturamento ÷ investimento">ROAS</abbr> ideal</dt><dd class="num" id="rRoasIdeal">–</dd></div>
        </dl>

        <div class="verdict" id="verdict"></div>
      </div>
    </section>
  </div>
</main>

<footer>Global Brand</footer>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cur = '$';

  document.querySelectorAll('.moedas button').forEach(function(b){
    b.addEventListener('click', function(){
      cur = b.dataset.cur;
      document.querySelectorAll('.moedas button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
      document.querySelectorAll('.cur').forEach(function(s){ s.textContent = cur; });
      calc();
    });
  });

  function fmt(v, d){ return v.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d}); }
  function money(v){ return cur + ' ' + fmt(v, 2); }
  function num(id){ var v = parseFloat($(id).value); return isNaN(v) ? null : v; }
  function show(ok){ $('empty').hidden = ok; $('res').hidden = !ok; }
  function erro(msg){ var e = $('err'); e.textContent = msg || ''; e.hidden = !msg; }

  function calc(){
    var custo = num('custo'), ticket = num('ticket');
    var taxaPct = num('taxa') || 0, lucroPct = num('lucro') || 0;

    if (custo === null || ticket === null || ticket <= 0){ erro(''); show(false); return; }
    if (custo >= ticket){ erro('O custo está igual ou acima do preço de venda: não sobra margem.'); show(false); return; }
    erro('');

    var taxa = ticket * taxaPct / 100;
    var lucro = ticket * lucroPct / 100;
    var cpaMax = ticket - custo - taxa;
    var cpaIdeal = cpaMax - lucro;
    var markup = ticket / custo;

    show(true);
    $('cpaIdeal').textContent = money(Math.max(cpaIdeal, 0));
    $('cpaMax').textContent = money(Math.max(cpaMax, 0));
    $('pIdeal').textContent = 'garante ' + fmt(lucroPct, 0) + '% de lucro';

    // Barra: lucro e anúncio só aparecem se houver sobra
    var lucroReal = Math.max(Math.min(lucro, cpaMax), 0);
    var ads = Math.max(cpaIdeal, 0);
    var partes = {bCusto:custo, bTaxa:taxa, bLucro:lucroReal, bAds:ads};
    var total = custo + taxa + lucroReal + ads;
    for (var k in partes) $(k).style.flexBasis = (partes[k] / total * 100) + '%';

    $('sTicket').textContent = money(ticket);
    $('lCusto').textContent = money(custo);
    $('lTaxa').textContent = money(taxa);
    $('lLucro').textContent = money(lucroReal);
    $('lAds').textContent = money(ads);

    $('rMarkup').textContent = fmt(markup, 1) + 'x';
    $('rRoasMin').textContent = cpaMax > 0 ? fmt(ticket / cpaMax, 2) : '–';
    $('rRoasIdeal').textContent = cpaIdeal > 0 ? fmt(ticket / cpaIdeal, 2) : '–';

    var v = $('verdict');
    if (cpaIdeal <= 0){
      v.className = 'verdict bad';
      v.innerHTML = '<strong>Não roda tráfego assim</strong><span>Não sobra nada para o anúncio com esse lucro. Suba o preço, corte o custo ou aceite menos margem.</span>';
    } else if (markup < 3){
      v.className = 'verdict meh';
      v.innerHTML = '<strong>Margem apertada</strong><span>Markup de ' + fmt(markup, 1) + 'x, abaixo da faixa de 3x a 4x. Dá para testar, mas qualquer alta de CPA come o lucro.</span>';
    } else {
      v.className = 'verdict ok';
      v.innerHTML = '<strong>Margem para escalar</strong><span>Até ' + money(cpaIdeal) + ' de CPA com ' + fmt(lucroPct, 0) + '% de lucro, e fôlego até ' + money(cpaMax) + ' na fase de teste.</span>';
    }
  }

  ['custo','ticket','taxa','lucro'].forEach(function(id){ $(id).addEventListener('input', calc); });
})();
</script>
</body>
</html>
